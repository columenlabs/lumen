# Every merge to main publishes every package to npm and tags the version, on OpenShip's
# self-hosted runner. The version is always the next patch after the newest v* tag (0.1.0, 0.1.1,
# 0.1.2 ...). A new minor is cut only by hand: Run workflow with bump = minor publishes main as the
# next minor no tag or npm version has used yet. packages/*/package.json versions are not read.
# Signs in to npm with the repository secret NPM_TOKEN. Then lumen-ship (packages/ship) makes the
# version's GitHub release, its notes written by Claude (secret ANTHROPIC_API_KEY).
# Run workflow with a tag only writes that tag's release (redo: write its notes again).
# The vault (packages/vault) is the exception: it is published by its own job, only when it changed
# since its last version on npm, from the `vault` environment, which waits for the owner's approval
# and holds its own token (NPM_TOKEN_VAULT). Without that token it is not published.
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Only make the GitHub release of this tag (v0.4.1); empty publishes main
        type: string
        default: ""
      redo:
        description: Write that release's notes again
        type: boolean
        default: false
      bump:
        description: Publish main as the next patch, or as a new minor
        type: choice
        options: [patch, minor]
        default: patch
permissions:
  contents: write # the v<version> tag and its release
  pull-requests: read # release notes read each PR's description
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.tag == '' || inputs.tag == null
    runs-on: [self-hosted, openship, linux, arm64]
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      vault: ${{ steps.vault.outputs.changed }}
    env:
      LUMEN_FORBIDDEN_NAMES: ${{ vars.LUMEN_FORBIDDEN_NAMES }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install jq
        run: |
          command -v jq && exit 0
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq jq
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run type-check
      - name: Install gh
        run: |
          command -v gh && exit 0
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq gh
      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          git fetch --tags --quiet
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          # Every version npm or a tag has used: npm never takes a number twice, even unpublished.
          used=$( { npm view @columenlabs/lumen-ui versions --json 2>/dev/null \
            | jq -r 'if type == "string" then . elif type == "array" then .[] else empty end' || true
            git tag --list 'v*' | sed 's/^v//'; } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV)
          IFS=. read -r a b c <<< "${last:-v0.1.-1}"; a=${a#v}
          if [ "$BUMP" = minor ]; then
            b=$(grep "^$a\." <<< "$used" | cut -d. -f2 | sort -n | tail -1)
            v="$a.$((b + 1)).0"
          else
            v="$a.$b.$((c + 1))"
            while grep -qx "$v" <<< "$used"; do c=$((c + 1)); v="$a.$b.$((c + 1))"; done
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing $v ($BUMP after ${last:-no tag})"
      - run: scripts/pack.sh out
        env:
          LUMEN_VERSION: ${{ steps.version.outputs.version }}
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for pkg in ui-types ui ship auth ops ai people tasks; do
            name=$(jq -r .name "out/$pkg/package.json")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
              continue
            fi
            # npm will not move latest on its own past the deprecated 0.2.0 to 0.4.4.
            (cd "out/$pkg" && npm publish --access public --tag latest)
          done
      - name: Point the old names at the new ones
        # The packages were @columenlabs/lumen and @columenlabs/lumen-types until 0.2.0.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pair in lumen:lumen-ui lumen-types:lumen-ui-types; do
            old="@columenlabs/${pair%%:*}"; new="@columenlabs/${pair##*:}"
            [ -n "$(npm view "$old" deprecated 2>/dev/null)" ] && continue
            npm deprecate "$old" "Renamed to $new: bun add $new"
          done
          # The 0.1.* renumber left a legacy dist-tag on each.
          for pkg in lumen-ui lumen-ui-types; do
            npm dist-tag ls "@columenlabs/$pkg" | grep -q '^legacy:' && npm dist-tag rm "@columenlabs/$pkg" legacy
          done || true
      - name: Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then exit 0; fi
          git tag "v$VERSION" && git push origin "v$VERSION"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: packages/ship/bin/lumen-ship release tag "v${{ steps.version.outputs.version }}"
      - name: Did the vault change
        id: vault
        run: |
          last=$(npm view @columenlabs/lumen-vault version 2>/dev/null || true)
          if [ -z "$last" ] || ! git rev-parse -q --verify "refs/tags/v$last" >/dev/null \
            || ! git diff --quiet "v$last" HEAD -- packages/vault; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "The vault changed since ${last:-never published}: its job waits for approval"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  vault:
    needs: publish
    if: needs.publish.outputs.vault == 'true'
    runs-on: [self-hosted, openship, linux, arm64]
    timeout-minutes: 15
    # Required reviewer: the owner. Its secret NPM_TOKEN_VAULT can publish only this package.
    environment: vault
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: scripts/pack.sh out
        env:
          LUMEN_VERSION: ${{ needs.publish.outputs.version }}
      - name: Publish the vault
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_VAULT }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN_VAULT is not set on the vault environment: not published"
            exit 1
          fi
          if npm view "@columenlabs/lumen-vault@$VERSION" version >/dev/null 2>&1; then
            echo "@columenlabs/lumen-vault@$VERSION is already on npm"; exit 0
          fi
          (cd out/vault && npm publish --access public --tag latest)

  release:
    if: inputs.tag != '' && inputs.tag != null
    runs-on: [self-hosted, openship, linux, arm64]
    timeout-minutes: 15
    env:
      LUMEN_FORBIDDEN_NAMES: ${{ vars.LUMEN_FORBIDDEN_NAMES }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install gh and jq
        run: |
          command -v gh && command -v jq && exit 0
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq gh jq
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDO: ${{ inputs.redo && '1' || '0' }}
          TAG: ${{ inputs.tag }}
        run: packages/ship/bin/lumen-ship release tag "$TAG"
