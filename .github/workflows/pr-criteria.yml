# A pull request merges only with a success-criteria table in its body: columns
# Criterion | Met? | Evidence, at least one row, every row met, every row with evidence.
# Its own workflow, not a step in CI, so editing the body reruns this check alone (seconds).
# The body comes from the event; .github/criteria/check.ts parses it with mdast (GFM).
# Public repo: like CI it runs only for this repo's own branches, never a fork's pull request.
name: Success criteria
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
# No concurrency group: a cancelled run posts a "skipped" check that can land after the real one
# and read as passing. Each run reads the current body from the API, so overlapping runs agree.
permissions:
  contents: read
  pull-requests: read
jobs:
  criteria:
    name: Success criteria table
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, openship, linux]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/criteria
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check the PR body
        working-directory: .github/criteria
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # A stalled install is cut at 30 s and tried once more, as CI does.
        run: |
          { timeout 30 bun install --frozen-lockfile || timeout 30 bun install --frozen-lockfile; } >/dev/null
          bun check.ts "$GITHUB_EVENT_PATH"
