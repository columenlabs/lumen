# Dependabot opens grouped update PRs once a week; nothing merges on its own.
# A person reviews and merges each one like any other PR (CI runs on OpenShip).
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: infra
    groups:
      # Patches and minors land together as one PR.
      minor-and-patch:
        update-types: [minor, patch]
      # Each major comes on its own so its breaking changes are read on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    commit-message:
      prefix: infra
    groups:
      actions:
        patterns: ["*"]
